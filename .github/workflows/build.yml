name: Build QA Cat Recorder

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Verify extension output
        run: |
          test -f dist/manifest.json
          test -f dist/sidepanel.html
          test -f dist/scripts/background.js
          test -f dist/scripts/content.js
          test -f dist/scripts/fieldPrivacy.js
          test -f dist/scripts/pageBridge.js
          test -f dist/icons/icon-16.png
          test -f dist/icons/icon-32.png
          test -f dist/icons/icon-48.png
          test -f dist/icons/icon-128.png

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: qa-cat-recorder-unpacked
          path: dist
